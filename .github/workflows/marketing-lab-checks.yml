name: Marketing lab checks
on:
  pull_request:
    paths:
      - 'lab/**'
      - 'api/**'
      - 'index.html'
      - 'tests/**'
      - 'site-builder/**'
      - 'server-handlers/**'
      - 'platform/**'
      - 'vercel.json'
      - 'website-samples/**'
      - '.github/workflows/marketing-lab-checks.yml'
  push:
    branches: [main]
    paths:
      - 'server-handlers/**'
      - 'platform/**'
      - 'db/**'
      - 'lab/**'
      - 'api/**'
      - 'index.html'
      - 'tests/**'
      - 'site-builder/**'
      - 'vercel.json'
      - 'website-samples/**'
permissions:
  contents: read
jobs:
  legacy-route-cleanup:
    name: Verify retired site and preserved admin workflows
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/active-momentum-workflow.test.cjs tests/retired-pages-redirects.test.cjs tests/search-trends.test.cjs tests/site-legacy-retirement.test.cjs tests/admin-only-workflow.test.cjs tests/admin-legacy-ui-retirement.test.cjs
  rank-regression:
    name: Place ranking outage and browser-control regression
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/rank-live-control.test.cjs tests/rank-outage-fallback.test.cjs tests/rank-position-accuracy.test.cjs tests/public-free-tools-access.test.cjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/active-momentum-workflow.test.cjs tests/admin-manual-measure.test.cjs tests/admin-connection.test.cjs tests/retired-pages-redirects.test.cjs tests/admin-email-login.test.cjs tests/hobby-function-budget.test.cjs tests/supabase-key-compat.test.cjs tests/admin-only-workflow.test.cjs tests/admin-session-isolation.test.cjs

  public-smoke:
    name: Anonymous production route audit
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f
        with:
          node-version: '22'
      - name: Probe production homepage and public API routes (no credentials)
        run: node tests/production-smoke.cjs
