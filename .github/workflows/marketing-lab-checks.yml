name: Marketing lab checks
on:
  pull_request:
    paths:
      - 'lab/**'
      - 'api/**'
      - 'index.html'
      - 'tests/**'
      - 'site-builder/**'
      - 'platform/**'
      - 'vercel.json'
      - 'website-samples/**'
      - '.github/workflows/marketing-lab-checks.yml'
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'api/**'
      - 'index.html'
      - 'tests/**'
      - 'site-builder/**'
      - 'vercel.json'
      - 'website-samples/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/lab.test.cjs

  browser:
    name: Browser and PNG export checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f # v4.4.0
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real browser checks
        run: |
          mkdir -p artifacts
          node tests/studio.browser.cjs
          node tests/keyword-matrix.browser.cjs
          node tests/competitor-compare.browser.cjs
          node tests/place-keyword-insights.browser.cjs
          node tests/member-portal.browser.cjs
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketing-studio-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
