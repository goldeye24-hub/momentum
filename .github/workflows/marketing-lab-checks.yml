name: Marketing lab checks
on:
  pull_request:
    paths:
      - 'lab/**'
      - 'api/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/marketing-lab-checks.yml'
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'api/**'
      - 'index.html'
      - 'tests/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020f # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/lab.test.cjs